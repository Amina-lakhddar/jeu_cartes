<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="src/input.css">
    <title>jeu des cartes</title>
</head>
<body>
    <header class="w-full flex justify-around items-center">
            <img src="images/logo-jeu.jpg" alt="" class="w-20 h-20">
            <h1 class="text-amber-400 font-bold text-5xl">Jeu des cartes</h1>
            <nav class="text-white flex flex-col gap-2 md:flex-row md:gap-2 lg:flex-row lg:gap-2  ">
                <a href="game.html" class="menu">Jouer</a>
                <a href="history.html" class="menu">Historique</a>
                <a href="players.html" class="menu">Profil</a>
            </nav>
       
    </header>
    <main>
        <div class="flex flex-col w-full justify-center items-center gap-3 md:h-full ">
            <section id="profil_joueur" class="w-full px-4 py-3 md:px-8 lg:px-12 bg-amber-300">
                <div class="rounded-xl border-black outline p-4">
                    <h1 class="font-bold text-xl">Créer votre profil</h1>
                    <form action="" class="flex flex-col ml-3 gap-1.5">
                        <label for="pseudo" class="text-xl">Votre pseudo :</label>
                        <input type="text" id="input_psuedo" name="pseudo" placeholder=" Yanis_07" required class="w-50 border-solid border-black outline px-2 py-1">
                        <span id="message-error-pseudo"></span>
                    </form>
                    <p class="p-4 text-xl">Choisissez votre avatar :</p>
                    <div class="grid grid-cols-2 gap-3 p-4 md:grid-cols-3 lg:grid-cols-4">
                        <img src="images/Adrian.svg" alt=""class="avatar">
                        <img src="images/Chloe.svg" alt="" class="avatar">
                        <img src="images/Noah.svg" alt="" class="avatar">
                        <img src="images/Zoe.svg" alt="" class="avatar">
                    </div>
                    <button class="bg-blue-800 text-white rounded-xl w-40 ml-2 p-2">+ Ajouter un joueur</button>
                </section>
                </div>
            <section id="liste_joueurs" class="w-full px-4 py-3 md:px-8 lg:px-12 bg-amber-600 ">
                <h1 class="font-bold text-xl p-2">Liste des joueurs</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 rounded-xl border-solid outline p-4 w-full gap-5">
                    <article class="bg-amber-300 w-60 rounded-xl flex flex-col justify-center items-center gap-2 p-2">
                        <img src="images/Adrian.svg" alt="" width="70px" height="70px">
                        <h2 class="font-bold">Amina_2006</h2>
                        <p>nombre de parties jouées : 6</p>
                        <button class="manipuler_profil">Modifier</button>
                        <button class="manipuler_profil">Supprimer</button>
                    </article>
                </div>
            </section>
        </div>
    </main>
    <footer class="bg-black text-white flex flex-col items-center justify-center">
    <h2 >
        ♠ Empereur, Citoyen, Esclave ♣
    </h2>

    <hr class="border-0 border-t-2 h-2 border-amber-500">

    <p>
        © 2026 — Tous droits réservés
    </p>

    <p>
        Créé avec passion ♥
    </p>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="src/input.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>jeu des cartes</title>

</head>
<body>
    <header class="w-full flex justify-around items-center ">
            <img src="images/logo-jeu.jpg" alt="" class="w-20 h-20">
            <h1 class="text-amber-400 font-bold font-['Redaction_35',serif] text-5xl">Jeu des cartes</h1>
            <nav class="text-white flex flex-col gap-2 md:flex-row md:gap-2 lg:flex-row lg:gap-2  ">
                <a href="game.html" class="menu">Jouer</a>
                <a href="history.html" class="menu">Historique</a>
                <a href="players.html" class="menu">Profil</a>
            </nav>
       
    </header>
    <main>
        <div class="flex flex-col w-full justify-center items-center gap-3 md:h-full bg-amber-300">
            <section id="profil_joueur" class="w-full px-4 py-3 md:px-8 lg:px-12 ">
                <div class="flex flex-col justify-around rounded-xl border-black outline p-4 md:flex-row lg:flex-row">
                    <div class="flex flex-col gap-2 justify-center">
                         <span class="error-valider-joueur font-bold text-2xl text-red-600"></span>
                        <h1 class="font-bold text-xl">Créer votre profil</h1>
                        <form id="form_profil" action="" class="flex flex-col ml-3 gap-1.5">
                            <label for="pseudo" class="text-xl">Votre pseudo :</label>
                            <input type="text" id="input_psuedo" name="pseudo" placeholder=" Yanis07" required class="w-50 border-solid border-black outline px-2 py-1">
                            <span class="message-error"></span>
                        </form>
                        <button class="ajouter_joueur bg-blue-800 text-white rounded-xl w-40 ml-2 p-2">+ Ajouter un joueur</button>
                        <button class="enregistrer_modification bg-blue-800 text-white rounded-xl w-40 ml-2 p-2 hidden">Enregistrer</button>
                    </div>
                    <div>
                        <p class="p-4 text-xl">Choisissez votre avatar :</p>
                        <span class="message-error-avatar p-4"></span>
                        <div class="liste_avatar grid grid-cols-2 gap-3 p-4 md:grid-cols-3 lg:grid-cols-2">
                            <img src="images/Adrian.svg" alt=""class="avatar" tabindex="0">
                            <img src="images/Chloe.svg" alt="" class="avatar" tabindex="0">
                            <img src="images/Noah.svg" alt="" class="avatar" tabindex="0">
                            <img src="images/Zoe.svg" alt="" class="avatar" tabindex="0">
                        </div>
                    </div>
                </section>
                </div>
            <section class="w-full px-4 py-3 md:px-8 lg:px-12 bg-blue-300">
                <h1 class="font-bold text-xl p-2">Liste des joueurs</h1>
                <div id="liste_joueurs" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4 rounded-xl border-solid outline p-4 w-full ">
                    
                </div>
            </section>
        </div>
    </main>
    <footer class="bg-black text-white flex flex-col items-center justify-center">
    <h2 >
        ♠ Empereur, Citoyen, Esclave ♣
    </h2>

    <hr class="border-0 border-t-2 h-2 border-amber-500">

    <p>
        © 2026 — Tous droits réservés
    </p>

    <p>
        Créé avec passion ♥
    </p>
</footer>
<script type="module" src="src/main.js"></script>
</body>
</html>
